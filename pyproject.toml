[project]
name = "hledger-dashboard"
version = "0.1.0"
description = "hledger finance dashboard"
requires-python = ">=3.12"
dependencies = [
    "dash>=2.17.0",
    "plotly>=5.22.0",
    "pandas>=2.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
